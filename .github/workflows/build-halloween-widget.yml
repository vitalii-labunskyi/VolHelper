name: Build Halloween Weather APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'HalloweenWeatherWidget/**'
      - '.github/workflows/build-halloween-widget.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HalloweenWeatherWidget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Check Android sources
        run: |
          test -f settings.gradle || { echo 'Android source files are not uploaded'; exit 1; }
          test -f app/build.gradle || { echo 'app/build.gradle is missing'; exit 1; }
      - name: Build debug APK
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug --no-daemon; else gradle assembleDebug --no-daemon; fi
      - uses: actions/upload-artifact@v4
        with:
          name: HalloweenWeatherWidget-debug-apk
          path: HalloweenWeatherWidget/app/build/outputs/apk/debug/*.apk
